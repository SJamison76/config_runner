---
- name: "PHASE 1: Pre-flight & Target Ingestion"
  hosts: localhost
  gather_facts: false
  strategy: linear
  vars:
    targets_file: "./targets.txt"
    commands_file: "./commands.txt"
    output_dir: "./logs"

  vars_prompt:
    - name: ssh_user
      prompt: "SSH username"
      private: no
    - name: ssh_password
      prompt: "SSH password"
      private: yes

  tasks:
    - name: "Verify sshpass is installed"
      command: which sshpass
      register: sshpass_check
      failed_when: sshpass_check.rc != 0
      changed_when: false

    - name: "Ensure output directory exists"
      file:
        path: "{{ output_dir }}"
        state: directory
        mode: '0755'

    - name: "Dynamically build inventory from targets.txt"
      add_host:
        name: "{{ item }}"
        groups: dynamic_targets
      loop: "{{ lookup('file', targets_file).splitlines() | reject('match', '^\\s*#') | reject('equalto', '') | list | unique }}"

    - name: "Extract vendor from commands.txt header"
      shell: grep -iE '^\s*##\s*vendor\s*:' "{{ commands_file }}" | head -1 | sed 's/.*vendor\s*:\s*//I' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'
      register: vendor_extract
      changed_when: false

    - name: "Set declared_vendor fact"
      set_fact:
        declared_vendor: "{{ vendor_extract.stdout }}"

    - name: "Fail if vendor tag missing or unsupported"
      fail:
        msg: "CRITICAL ERROR: Unsupported or missing vendor tag in commands.txt."
      when: declared_vendor not in ['cisco', 'juniper', 'brocade']

    - name: "Strip vendor header from commands.txt and write clean payload to disk"
      shell: grep -vE '^\s*##\s*vendor\s*:' "{{ commands_file }}" > /tmp/ansible_clean_payload.txt
      changed_when: false

    - name: "Persist prompt credentials for subsequent plays"
      set_fact:
        ssh_user: "{{ ssh_user }}"
        ssh_password: "{{ ssh_password }}"


- name: "PHASE 2: Parallel Execution Engine"
  hosts: dynamic_targets
  gather_facts: false
  serial: 20
  vars:
    output_dir: "./logs"
    ssh_timeout: 8
    ssh_cmd_wait: 20

  tasks:
    - name: "Stage clean payload locally per target"
      copy:
        src: "/tmp/ansible_clean_payload.txt"
        dest: "/tmp/payload_{{ inventory_hostname }}.txt"
      delegate_to: localhost

    - name: "Execute Payload"
      shell: |
        TARGET="{{ inventory_hostname }}"
        SSH_PASS="{{ hostvars['localhost']['ssh_password'] }}"
        SSH_USER="{{ hostvars['localhost']['ssh_user'] }}"
        OUTPUT_DIR="{{ output_dir }}"
        PAYLOAD="/tmp/payload_${TARGET}.txt"

        SSH_OPTS="-o PreferredAuthentications=password \
                  -o PubkeyAuthentication=no \
                  -o StrictHostKeyChecking=no \
                  -o ConnectTimeout={{ ssh_timeout }} \
                  -o ServerAliveInterval=5 \
                  -o ServerAliveCountMax=2"

        LOG_TMP=$(mktemp /tmp/ansible_run_XXXXXX)
        VENDOR="{{ hostvars['localhost']['declared_vendor'] }}"

        if [ "$VENDOR" = "cisco" ] || [ "$VENDOR" = "brocade" ]; then
          # --- CISCO / BROCADE: no commit, send payload as-is ---
          # Brief sleep at start lets the device finish its banner before commands arrive
          timeout {{ ssh_cmd_wait }} bash -c \
            "(sleep 5; cat '$PAYLOAD') | sshpass -p '$SSH_PASS' ssh -tt $SSH_OPTS ${SSH_USER}@${TARGET}" \
            > "$LOG_TMP" 2>&1 || true

          if [ -z "$(cat $LOG_TMP)" ] || grep -qiE '(connect to host|connection timed out|connection refused|no route to host|permission denied)' "$LOG_TMP"; then
            { echo "STATUS:UNREACHABLE"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
            rm -f "$LOG_TMP"
            echo "STATUS:UNREACHABLE"
            exit 0
          fi


          # Validate commands actually ran — must see a config prompt in output
          if ! grep -qE "\(config" "$LOG_TMP"; then
            { echo "STATUS:NO_COMMANDS_EXECUTED"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
            rm -f "$LOG_TMP"
            echo "STATUS:NO_COMMANDS_EXECUTED"
            exit 0
          fi

          { echo "STATUS:SUCCESS"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
          rm -f "$LOG_TMP"
          echo "STATUS:SUCCESS"
          exit 0
        fi

        # --- JUNIPER: strip exit lines, send up to commit, check result ---
        STRIPPED=$(mktemp /tmp/ansible_stripped_XXXXXX)
        grep -vE '^exit$' "$PAYLOAD" > "$STRIPPED"

        timeout {{ ssh_cmd_wait }} bash -c \
          "(cat '$STRIPPED'; sleep 2) | sshpass -p '$SSH_PASS' ssh -tt $SSH_OPTS ${SSH_USER}@${TARGET}" \
          > "$LOG_TMP" 2>&1 || true

        rm -f "$STRIPPED"

        # Check unreachable
        if [ -z "$(cat $LOG_TMP)" ] || grep -qiE '(connect to host|connection timed out|connection refused|no route to host|permission denied)' "$LOG_TMP"; then
          { echo "STATUS:UNREACHABLE"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
          rm -f "$LOG_TMP"
          echo "STATUS:UNREACHABLE"
          exit 0
        fi

        # Check for pre-existing candidate config
        if grep -q "The configuration has been changed but not committed" "$LOG_TMP"; then
          timeout 10 bash -c \
            "(printf '%s\n' 'exit' 'exit'; sleep 1) | sshpass -p '$SSH_PASS' ssh -tt $SSH_OPTS ${SSH_USER}@${TARGET}" \
            >> "$LOG_TMP" 2>&1 || true
          { echo "STATUS:CANDIDATE_CONFIG_PRESENT"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
          rm -f "$LOG_TMP"
          echo "STATUS:CANDIDATE_CONFIG_PRESENT"
          exit 0
        fi

        # Check for commit failure — rollback then exit
        if grep -q "error: configuration check-out failed" "$LOG_TMP"; then
          timeout 20 bash -c \
            "(printf '%s\n' 'edit' 'rollback 0' 'exit' 'exit'; sleep 2) | sshpass -p '$SSH_PASS' ssh -tt $SSH_OPTS ${SSH_USER}@${TARGET}" \
            >> "$LOG_TMP" 2>&1 || true
          { echo "STATUS:COMMIT_FAILURE"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
          rm -f "$LOG_TMP"
          echo "STATUS:COMMIT_FAILURE"
          exit 0
        fi

        # Commit succeeded — exit config mode and SSH cleanly
        timeout 10 bash -c \
          "(printf '%s\n' 'exit' 'exit'; sleep 1) | sshpass -p '$SSH_PASS' ssh -tt $SSH_OPTS ${SSH_USER}@${TARGET}" \
          >> "$LOG_TMP" 2>&1 || true

        { echo "STATUS:SUCCESS"; cat "$LOG_TMP"; } > "${OUTPUT_DIR}/${TARGET}_execution.log"
        rm -f "$LOG_TMP"
        echo "STATUS:SUCCESS"
      args:
        executable: /bin/bash
      register: exec_result
      delegate_to: localhost
      async: 90
      poll: 5

    - name: "Remove staged local payload"
      file:
        path: "/tmp/payload_{{ inventory_hostname }}.txt"
        state: absent
      delegate_to: localhost


- name: "PHASE 3: Consolidated Summary Report"
  hosts: localhost
  gather_facts: false
  vars:
    output_dir: "./logs"
  tasks:
    - name: "Read status from each host log file"
      shell: head -1 "{{ output_dir }}/{{ item }}_execution.log" 2>/dev/null || echo "STATUS:UNKNOWN"
      loop: "{{ groups['dynamic_targets'] }}"
      register: host_statuses
      changed_when: false

    - name: "Generate Summary Structure"
      copy:
        dest: "{{ output_dir }}/SUMMARY_{{ now(fmt='%Y%m%d_%H%M%S') }}.txt"
        content: |
          ======================================================================
          CHANGE WINDOW SUMMARY REPORT
          ======================================================================
          Executed: {{ now(fmt='%Y-%m-%d %H:%M:%S') }}

          RESULTS BREAKDOWN:
          ----------------------------------------------------------------------
          {% for result in host_statuses.results %}
          {{ result.item }} : {{ result.stdout | trim }}
          {% endfor %}
          ======================================================================