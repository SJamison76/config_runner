[defaults]
# Inventory is only used for the localhost control node.
# All network targets are read from targets.txt inside the playbook.
inventory = ./inventory.ini

gathering = explicit
bin_ansible_callbacks = True
command_warnings = False
host_key_checking = False
retry_files_enabled = False
localhost_warning = False

# forks only affects Ansible-managed host parallelism.
# Since everything runs on localhost, this has minimal impact.
# Increase if you later move to inventory-based remote execution.
forks = 20

# CRITICAL FOR 3,000+ TARGETS: Prevents slow/unreachable devices from
# blocking responsive devices in the execution queue.
# Defined here only — play_runner.yml no longer duplicates this.
strategy = free

# Ansible control connection timeout (applies to localhost connection only).
# NOTE: SSH probe timeout is controlled separately by ssh_timeout in the playbook (default: 10s).
# Keep this higher than ssh_timeout to avoid Ansible killing tasks mid-probe.
timeout = 20

nocows = 1
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
# Optimizes local SSH multiplexing to speed up the local execution engine
pipelining = True
