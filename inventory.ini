# Ansible Inventory — SSH Audit Playbook
#
# This playbook runs entirely on localhost (the control node).
# Network targets are NOT defined here — they are read at runtime
# from targets.txt via lookup('file', targets_file).
#
# ansible_connection=local  →  no SSH to 127.0.0.1; runs directly in the shell.
# ansible_python_interpreter →  explicit path avoids auto-detection warnings.

[local]
localhost ansible_connection=local
